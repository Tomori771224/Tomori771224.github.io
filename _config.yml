# Build settings
permalink: pretty
paginate: 10
exclude: ["less", "node_modules", "Gruntfile.js", "package.json", "README.md"]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`

# Gems
gems: [jekyll-paginate]

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM # use Github Flavored Markdown !important

# 评论系统
# Gitalk 评论系统
# 提示：原作者留的密钥不能直接用，所以我帮你关掉了（enable: false）。等你想开评论了再去申请。
gitalk:
  enable: false #是否开启Gitalk评论
  clientID: "" #生成的clientID
  clientSecret: "" #生成的clientSecret
  repo: Tomori771224.github.io #仓库名称
  owner: Tomori771224 #github用户名
  admin: Tomori771224
  distractionFreeMode: true

# 统计
# 提示：原作者的统计代码我全删了，免得你帮他刷数据。

# Featured Tags
featured-tags: true # 是否使用首页标签
featured-condition-size: 1 # 相同标签数量大于这个数，才会出现在首页

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# Friends (友链)
friends: [] # 提示：这里被我清空了，你可以以后按格式加自己的朋友。
