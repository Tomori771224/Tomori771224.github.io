# Site settings
title: Tomori的博客
SEOTitle: Tomori的博客 | Tomori Blog
header-img: img/post-bg-desk.jpg
email: "your-email@example.com"
description: "Welcome to my blog."
keyword: "Tomori, Blog, Tech"
url: "https://tomori771224.github.io" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/Tomori771224/Tomori771224.github.io.git" # you code repository

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "Hello, I am Tomori."
sidebar-avatar: /img/about-BY-gentle.jpg # 注意：这是头像路径，稍后教你怎么换
# 提示：为了安全，原作者的头像图片稍后你可以自己找一张替换掉。

# SNS settings
RSS: false
# weibo_username:     qiubaiying
# zhihu_username:     qiubaiying
github_username: Tomori771224
# facebook_username:  baiying.qiu.7
# jianshu_username:   e71990ada2fd
